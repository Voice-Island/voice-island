[project]
name = "voice-id-bench"
version = "0.1.0"
description = "Mesure de la vérification du locuteur (« n'écouter que ma voix ») avant de l'intégrer à l'agent."
requires-python = ">=3.11,<3.13"
dependencies = [
    "speechbrain>=1.0",
    "torch",
    "torchaudio",
    "soundfile",
    "sounddevice",
    "numpy",
    "onnxruntime",
    "huggingface_hub",
    "kaldi-native-fbank>=1.22.5",
]

[tool.uv]
package = false
