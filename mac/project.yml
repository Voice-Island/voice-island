name: VoiceIsland
options:
  deploymentTarget:
    macOS: "14.0"
  # English first; French comes from the String Catalogs (Localizable.xcstrings, InfoPlist.xcstrings).
  developmentLanguage: en
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.18.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  VoiceIsland:
    type: application
    platform: macOS
    sources: [VoiceIsland]
    info:
      path: VoiceIsland/Info.plist
      properties:
        CFBundleDisplayName: Voice Island
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        # Menu bar app: no Dock icon.
        LSUIElement: true
        NSMicrophoneUsageDescription: Voice Island listens to your voice when you start it with the keyboard shortcut.
        NSSpeechRecognitionUsageDescription: Dictation transcribes your voice on this Mac and sends nothing anywhere.
        NSCalendarsFullAccessUsageDescription: The assistant reads and adds events when you ask; moving or deleting one asks for your confirmation.
        NSRemindersFullAccessUsageDescription: The assistant adds the reminders you ask for.
        # The repo's web/ folder, to read the settings and launch dev.sh without a hard-coded path.
        VoiceIslandWebDir: $(SRCROOT)/../web
        NSAppleEventsUsageDescription: The assistant reads the Chrome tab on screen and opens YouTube in it when you ask.
    # Signing and bundle ID: Config/Base.xcconfig (ad hoc by default), overridden by Config/Local.xcconfig
    # (not versioned) to sign with your own certificate.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
