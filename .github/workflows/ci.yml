name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent tests (Python)
    runs-on: macos-15
    defaults:
      run:
        working-directory: web/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  mac:
    name: Mac app build
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project VoiceIsland.xcodeproj -scheme VoiceIsland -configuration Debug
          -derivedDataPath build -skipMacroValidation -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO build

  web:
    name: Web interface type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
